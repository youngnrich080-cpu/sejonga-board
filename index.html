<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>세종아 보드</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<link rel="stylesheet" href="devis-storyboard.css">
<style>
  :root{--sj:#0FB981;--sj-bg:#E7F7F0;--hj:#2F6FEB;--hj-bg:#E8F0FE;--line:#E5E7EB;--ink:#141618;--sub:#6A7075}
  *{box-sizing:border-box}
  body{margin:0;font-family:"Pretendard Variable",Pretendard,-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo",sans-serif;color:var(--ink);background:#F7F8FA}
  .wrap{max-width:640px;margin:0 auto;padding:16px}
  h1{font-size:20px;margin:4px 0 12px}
  h2{font-size:16px;margin:20px 0 8px}
  button{font:inherit;border:1px solid var(--line);background:#fff;border-radius:10px;padding:10px 14px;cursor:pointer}
  button.primary{background:#111;color:#fff;border-color:#111}
  input,textarea,select{font:inherit;width:100%;border:1px solid var(--line);border-radius:10px;padding:10px;background:#fff}
  textarea{min-height:90px;resize:vertical}
  label{display:block;font-size:13px;color:var(--sub);margin:12px 0 4px}
  .row{display:flex;gap:8px;align-items:center}
  .todo{display:grid;grid-template-columns:1fr 1fr;gap:8px}
  .box{border-radius:12px;padding:12px;min-height:70px}
  .box.sj{background:var(--sj-bg)} .box.hj{background:var(--hj-bg)}
  .box h3{margin:0 0 6px;font-size:14px}
  .box a{display:block;font-size:14px;padding:4px 0;color:inherit;text-decoration:underline;cursor:pointer}
  .card{background:#fff;border:1px solid var(--line);border-left-width:6px;border-radius:12px;padding:12px;margin:8px 0;cursor:pointer}
  .card.sj{border-left-color:var(--sj)} .card.hj{border-left-color:var(--hj)} .card.done{border-left-color:#bbb;opacity:.7}
  .card .t{font-weight:600}
  .card .cardIn{display:flex;gap:10px;align-items:flex-start}
  .card .cardIn>div{flex:1;min-width:0}
  .card img.thumb{flex:none;height:64px;width:auto;max-width:96px;object-fit:cover;border-radius:8px;background:#eee}
  .meta{font-size:13px;color:var(--sub);margin-top:4px}
  .bar{height:8px;background:#eee;border-radius:4px;margin-top:8px;overflow:hidden}
  .bar i{display:block;height:100%}
  .who{display:inline-block;font-size:12px;font-weight:700;padding:2px 8px;border-radius:999px;color:#fff}
  .who.sj{background:var(--sj)} .who.hj{background:var(--hj)} .who.none{background:#999}
  .steps{list-style:none;padding:0;margin:8px 0}
  .steps li{display:flex;gap:8px;align-items:center;padding:8px;border-radius:10px;margin:4px 0;background:#fff;border:1px solid var(--line)}
  .steps li.cur{outline:2px solid #111}
  .steps li.ok{color:#999}
  .steps li .sw{margin-left:auto;flex:none;font-size:12px;color:#6A7075;padding-left:8px}
  .steps li.ok .lbl{text-decoration:line-through}
  .tabs{display:flex;gap:6px;flex-wrap:wrap}
  .tabs button.on{background:#111;color:#fff}
  .hide{display:none}
  .msg{font-size:13px;color:#c00;margin-top:8px}
  .saved{font-size:12px;color:var(--sub)}
  /* 띄어쓰기 없는 긴 글(쿠팡 주소 등)이 화면 밖으로 나가 폰 화면이 축소되던 것 막기 */
  .meta,.card .t,.box a,.dhead h1,#d_meta{overflow-wrap:anywhere;min-width:0}
  .meta.one{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  #saveBtn:disabled{opacity:.45;cursor:default}
  .cbar{display:flex;flex-wrap:wrap;align-items:center;gap:8px;background:#FFF4E5;border:1px solid #F5C27A;border-radius:10px;padding:8px 10px;margin:8px 0;font-size:14px}
  .cbar span{flex:1 1 220px}
  .cbar.hide{display:none}
  .lvToast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);z-index:60;max-width:calc(100vw - 32px);padding:10px 16px;border-radius:12px;background:#141618;color:#fff;font-size:15px;line-height:1.4}
  /* 누가 보는 중 · 고치는 중 */
  .mePick{display:flex;gap:6px;align-items:center;margin:4px 0}
  .mePick button.on{background:#111;color:#fff;border-color:#111}
  .dtl{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
  .pvBar{font-size:14px;color:var(--sub);display:flex;gap:10px;flex-wrap:wrap}
  .pvBar b{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:5px;vertical-align:1px}
  .pvBar .dots i{font-style:normal;animation:pvDot 1.2s infinite;opacity:.2}
  .pvBar .dots i:nth-child(2){animation-delay:.2s} .pvBar .dots i:nth-child(3){animation-delay:.4s}
  @keyframes pvDot{0%,100%{opacity:.2}40%{opacity:1}}
  .pvs{display:inline-flex;margin-left:auto;margin-right:6px}
  .pvs i{font-style:normal;width:22px;height:22px;border-radius:50%;color:#fff;font-size:12px;font-weight:700;display:inline-flex;align-items:center;justify-content:center;border:2px solid #fff;margin-left:-6px}
  .pvs i:first-child{margin-left:0}
  .pvs i.more{background:#6A7075}

  /* 보기 전환: 작은 칩 */
  .vtabs{display:flex;gap:6px;margin:12px 0}
  .vtabs button{font-size:12px;border-radius:8px;padding:6px 12px}
  .vtabs button.on{background:#111;color:#fff;border-color:#111}
  .wrap.wide{max-width:960px}
  .dhead h1{margin:12px 0 2px}
  /* 폰 */
  @media (max-width:600px){
    body{font-size:16px;line-height:1.6}
    .wrap,.wrap.wide{padding:12px 16px}
    button{min-height:44px}
    input,textarea,select{font-size:16px;min-height:44px}
    label,.meta,.saved,.msg,.who,.box h3,.box a{font-size:16px}
    .meta{color:#5A6066}
    #list>.row:first-child{flex-wrap:wrap}
    .todo{grid-template-columns:1fr}
    .box a{min-height:44px;display:flex;align-items:center;padding:0}
    .tabs{display:grid;grid-template-columns:repeat(4,1fr)}
    .tabs button{padding:10px 4px}
    .card img.thumb{max-width:72px}
    #detail .row{flex-wrap:wrap}
    /* 머리 영역 */
    .dhead h1{font-size:22px;font-weight:800}
    #d_meta{font-size:15px;color:#5A6066}
    .vtabs button{font-size:15px;flex:1}
    /* 진행 칸 */
    .steps li{min-height:48px;font-size:15px}
    .steps li .meta{font-size:15px}
    .steps li .sw{font-size:13px;color:#5A6066}
    .pvBar{font-size:15px}
    .pvs i{width:26px;height:26px;font-size:13px}
  }
</style>
</head>
<body>
<div class="wrap">

  <!-- 로그인 -->
  <section id="login" class="hide">
    <h1>세종아 보드</h1>
    <label>이메일</label><input id="email" type="email" value="sejongahhh@gmail.com">
    <label>비밀번호</label><input id="pw" type="password">
    <div style="margin-top:12px"><button class="primary" id="loginBtn">로그인</button></div>
    <div class="msg" id="loginMsg"></div>
  </section>

  <!-- 목록 -->
  <section id="list" class="hide">
    <div class="row" style="justify-content:space-between">
      <h1>세종아 보드</h1>
      <div class="row"><button id="newBtn" class="primary">+ 새 대본</button><button id="logoutBtn">로그아웃</button></div>

    <div id="conflict" class="cbar hide"><span id="cMsg">다른 곳에서 이 대본을 고쳤어요 — 내 글은 그대로 있어요(저장은 멈춤)</span><button id="cTake">새 글 보기</button><button id="cMine" class="primary">내 글로 덮기</button></div>
    <div id="v_dsb"></div>
    <div id="v_txt">
    <label>제목</label><input id="f_title">
    <div class="row">
      <div style="flex:1"><label>기획</label><input id="f_plan" placeholder="A 식비 챌린지 등"></div>
      <div style="flex:1"><label>작성자</label><select id="f_author"><option>현재</option><option>세종</option></select></div>

    <label>대본 원문</label><textarea id="f_body" style="min-height:200px"></textarea>
    <label>꼭 찍어야 할 장면 3~4개</label><textarea id="f_must_shots"></textarea>

      <button class="primary" id="nextBtn">다음 단계 완료 체크</button>
      <button id="prevBtn">한 단계 되돌리기</button>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="devis-storyboard.js"></script>
<script src="prcore898.js"></script>
<script>
const SUPABASE_URL = "https://ndyygluwlfeqibpdhnjk.supabase.co";
const SUPABASE_KEY = "sb_publishable_RuA_IM5-e9UO5PBdktLYqw_R4qnfryP";
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

// stage: 체크된 마지막 단계. 0이면 대본 작성 중.
const STAGES = [
  {pct:0,   label:"대본 작성 중",                      next:"대본 완성",                    who:null},
  {pct:25,  label:"ㄱ 대본 완성",                      next:"ㄴ 촬영 · 원본 클라우드 공유",   who:"세종"},
  {pct:50,  label:"ㄴ 촬영 완료",                      next:"ㄷ TTS 나레이션 · 컷편집 · 자막", who:"현재"},
  {pct:75,  label:"ㄷ 1차 편집 완료",                  next:"ㄹ 효과음 · 자막효과 · 검수 · 드라이브 업로드", who:"세종"},
  {pct:95,  label:"ㄹ 최종 편집 · 드라이브 업로드 완료", next:"플랫폼 업로드",                who:"현재"},
  {pct:100, label:"업로드 완료",                       next:null,                           who:null},
];
const whoCls = w => w==="세종"?"sj":w==="현재"?"hj":"none";
// 0단계(작성 중)는 작성자가 할 일
const ownerOf = s => s.stage===0 ? s.author : STAGES[s.stage].who;

let rows = [], cur = null, filter = "진행 중";
const $ = id => document.getElementById(id);
const show = id => { ["login","list","detail"].forEach(x => $(x).classList.toggle("hide", x!==id)); if(id!=="detail") document.querySelector(".wrap").classList.remove("wide"); };
const esc = t => (t||"").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

let view = "sb", dirty = false, pendingUndo = null;
// ---------- 같이 고치기 (#900, 6차 지시) — 같은 채널 board:<방>의 broadcast 'live' · 규칙(합치기·말 받기·잠금)은 DevisSB.live(Devis 와 같은 코드) ----------
const LVF = DevisSB.live;
const LV = { c: (crypto.randomUUID ? crypto.randomUUID() : String(Math.random()).slice(2)),   // 이 창 번호
  mine: new Map(),    // 대본 id → { seq, last }  (seq 는 이 창에서 계속 늘어남 — 다시 열어도 작아지지 않게)
  peers: new Map(),   // 보낸 창 → { text, seq } (그 사람 글로 내가 아는 것)
  locks: new Map(),   // 보낸 창 → { who, line, hint, since, seen }
  wantAt: new Map(), sendT: 0, anc: null, q: [], composing: false, my: { line: null, since: 0 } };
const lvMine = () => { let st = LV.mine.get(cur.id); if(!st) LV.mine.set(cur.id, st = { seq: 0, last: null }); return st; };
const lvOn = () => !!(PR.ch && PR.ready && prWho() && cur && !$("detail").classList.contains("hide") && formVal("body").length <= 20000);   // 2만 자 넘으면 끔(저장은 그대로)
function lvSend(m){ if(lvOn()) PR.ch.send({ type: "broadcast", event: "live", payload: { v: 1, e: m.e, sid: cur.id, c: LV.c, who: prWho(), ...m } }).catch(() => {}); }
function lvFull(){ const st = lvMine(), t = formVal("body"); if(!st.seq) st.seq = 1; clearTimeout(LV.sendT); st.last = t; lvSend({ e: "full", key: "body", seq: st.seq, full: t }); }
function lvBody(){ clearTimeout(LV.sendT); LV.sendT = setTimeout(lvFlush, 250); }   // 0.25초 모아서
function lvFlush(){
  if(!lvOn()) return;
  const st = lvMine(), t = formVal("body");
  if(st.last === null){ st.seq++; st.last = t; return lvSend({ e: "full", key: "body", seq: st.seq, full: t }); }   // 이 대본에서 처음 = 전체
  const h = LVF.lineHunk(st.last, t);
  if(!h) return;
  st.seq++;
  if(h.lines.join("\n").length > 12000) lvSend({ e: "full", key: "body", seq: st.seq, full: t });
  else lvSend({ e: "ed", key: "body", seq: st.seq, base: LVF.textHash(st.last), from: h.from, to: h.to, lines: h.lines });
  st.last = t;
}
function lvOpen(){ LV.peers.clear(); LV.locks.clear(); LV.q = []; LV.anc = formVal("body"); LV.my = { line: null, since: 0 }; if(cur) lvMine().last = null; lvSend({ e: "want" }); }
function lvClose(){ clearTimeout(LV.sendT); if(LV.my.line != null){ LV.my.line = null; lvSendLk(); } LV.peers.clear(); LV.locks.clear(); }
function lvUp(again){ if(!cur || $("detail").classList.contains("hide")) return; if(again) lvFull(); lvSend({ e: "want" }); lvTrack(); }   // 다시 붙으면 내 글 전체 + 부탁 한 번
function lvRecv(m){
  if(!m || m.v !== 1 || m.c === LV.c || !cur || m.sid !== cur.id || $("detail").classList.contains("hide")) return;
  if(LV.composing){ LV.q.push(m); return; }                    // 한글 조합이 끝난 뒤에 넣음
  if(formVal("body").length > 20000) return;
  if(m.e === "want"){ if(!m.to || m.to === LV.c) lvFull(); return; }
  if(m.e === "lk") return lvLock(m);
  if((m.e === "ed" || m.e === "full") && m.key === "body"){
    const mine = formVal("body"),
      r = LVF.recv(LV.peers.get(m.c) || null, { seq: m.seq, base: m.base, from: m.from, to: m.to, lines: m.lines, full: m.e === "full" ? m.full : null }, mine, LV.anc);
    if(r.act === "drop") return;
    if(r.act === "want"){ const t = LV.wantAt.get(m.c) || 0; if(Date.now() - t >= 1000){ LV.wantAt.set(m.c, Date.now()); lvSend({ e: "want", to: m.c }); } return; }
    LV.peers.set(m.c, r.peer);
    if(r.text !== mine) lvApply(mine, r.text);
  }
}
function lvFlushQ(){ LV.composing = false; const q = LV.q; LV.q = []; q.forEach(lvRecv); }
document.addEventListener("compositionstart", () => { LV.composing = true; });
document.addEventListener("compositionend", () => setTimeout(lvFlushQ, 0));
// 글자 위치 ↔ (줄, 칸 안 위치)
const lineOfPos = (v, p) => v.slice(0, p).split("\n").length - 1;
// 남의 고침(또는 저장 때 합친 글)을 내 글에 넣기 — 커서·스크롤·치는 칸 그대로 · 되돌리기 기록의 옛 글들에도 같은 고침
function lvApply(old, txt, quiet){
  const oL = old.split("\n"), nL = txt.split("\n"), sx = scrollX, sy = scrollY, ta = $("f_body"), ae = document.activeElement;
  if(ae === ta){
    const s = ta.selectionStart, e = ta.selectionEnd, map = p => { const l = lineOfPos(old, p), col = p - (old.lastIndexOf("\n", p - 1) + 1), nl = LVF.lineMap(oL, nL, l); return nL.slice(0, nl).reduce((a, x) => a + x.length + 1, 0) + Math.min(col, (nL[nl] || "").length); };
    const ns = map(s), ne = map(e); ta.value = txt; ta.setSelectionRange(ns, ne);
  } else ta.value = txt;
  const ed = view === "sb" && DevisSB.editor($("v_dsb"));
  if(ed) ed.remote(txt);                                        // Devis 손잡이: 커서·치는 칸 그대로 · 되돌리기 기록에도 남의 고침 · 한글 조합 중이면 끝난 뒤
  else if(view === "tts") setView("tts");
  scrollTo(sx, sy);
  if(LV.my.line != null){ const nl = LVF.lineMap(oL, nL, LV.my.line); if(nl !== LV.my.line){ LV.my.line = nl; lvSendLk(); } }
  lvDrawLocks();
  onEdit(false);
  if(quiet) lvBody();
}
// ---- 줄 잠금
const josa = n => { const c = n.charCodeAt(n.length - 1) - 0xAC00; return c >= 0 && c <= 11171 && c % 28 ? "이" : "가"; };   // 세종이 · 현재가
function lvToast(msg){ const d = document.createElement("div"); d.className = "lvToast"; d.textContent = msg; document.body.appendChild(d); setTimeout(() => d.remove(), 2200); }
function lvMyLine(){
  const ae = document.activeElement;
  if(ae === $("f_body")) return lineOfPos(ae.value, ae.selectionStart);
  const ed = view === "sb" && DevisSB.editor($("v_dsb")), c = ed && ed.cursor();
  return c ? c.line : null;
}
function lvSendLk(){ const L = formVal("body").split("\n"), l = LV.my.line; lvSend({ e: "lk", line: l, hint: l == null ? "" : (L[l] || "").slice(0, 12), since: LV.my.since }); }
function lvTrack(){
  const l = lvOn() ? lvMyLine() : null;
  if(l === LV.my.line) return;
  LV.my.line = l; LV.my.since = Date.now(); lvSendLk(); lvDrawLocks();
}
document.addEventListener("focusin", () => setTimeout(lvTrack, 0));
document.addEventListener("focusout", () => setTimeout(lvTrack, 0));   // 다시 그리느라 칸이 잠깐 빠져도 같은 줄이면 그대로(since 안 바뀜)
document.addEventListener("selectionchange", () => { if(document.activeElement === $("f_body")) lvTrack(); });
["keyup", "click"].forEach(ev => $("f_body").addEventListener(ev, lvTrack));
setInterval(() => { if(LV.my.line != null && lvOn()) lvSendLk(); }, 2000);   // 같은 줄에 있는 동안 2초마다 다시 알림
setInterval(() => {                                              // 5초 소식 없는 잠금은 풂
  let gone = false; for(const [c, k] of LV.locks) if(Date.now() - k.seen > LVF.LK_TTL){ LV.locks.delete(c); gone = true; } if(gone) lvDrawLocks(); }, 1000);
// 남이 잡은 줄들(내 글 줄 번호로) — 같은 줄을 내가 먼저 잡았으면 빼고
function lvLockedLines(){
  const out = new Map(); if(!lvOn()) return out;
  const L = formVal("body").split("\n"), now = Date.now(), me = { since: LV.my.since, who: prWho(), c: LV.c };
  for(const [c, k] of LV.locks){
    if(now - k.seen > LVF.LK_TTL || k.line == null) continue;
    const li = LVF.lkFind(L, k.line, k.hint);
    if(li < 0 || (li === LV.my.line && LVF.lkWin(me, { ...k, c }))) continue;
    out.set(li, k.who);
  }
  return out;
}
function lvLock(m){
  if(m.line == null){ LV.locks.delete(m.c); return lvDrawLocks(); }
  LV.locks.set(m.c, { who: m.who, line: m.line, hint: m.hint, since: m.since, seen: Date.now() });
  const L = formVal("body").split("\n"), li = LVF.lkFind(L, m.line, m.hint);
  // 같은 줄을 남이 먼저 잡음 → 스토리보드는 잠금을 그리면 Devis 파일이 칸에서 빼고 onLockedOut(알림) · 글 보기는 알림만(치기는 beforeinput 에서 막음)
  if(li >= 0 && li === LV.my.line && document.activeElement === $("f_body") && !LVF.lkWin({ since: LV.my.since, who: prWho(), c: LV.c }, { since: m.since, who: m.who, c: m.c }))
    lvToast(`${m.who}${josa(m.who)} 쓰는 중인 줄이에요`);
  lvDrawLocks();
}
function lvDrawLocks(){                                           // 잠긴 줄 그리기는 Devis 손잡이(setLocks) — 다시 그려도 그대로
  const ed = DevisSB.editor($("v_dsb"));
  if(ed) ed.setLocks([...lvLockedLines()].map(([line, who]) => ({ line, who, color: prColor(who) })));
}
// 글 보기(textarea): 잠긴 줄에 치기·붙게 되는 지우기를 막음
$("f_body").addEventListener("beforeinput", e => {
  const lk = lvLockedLines(); if(!lk.size) return;
  const t = e.target, v = t.value, s = t.selectionStart, en = t.selectionEnd;
  let a = lineOfPos(v, s), b = lineOfPos(v, en);
  if(e.inputType === "deleteContentBackward" && s === en && s > 0 && v[s - 1] === "\n") a--;   // 아래 줄 맨 앞 Backspace = 위 줄에 붙음
  if(e.inputType === "deleteContentForward" && s === en && v[s] === "\n") b++;                 // 위 줄 맨 끝 Delete
  for(let l = a; l <= b; l++) if(lk.has(l)){ e.preventDefault(); lvToast(`${lk.get(l)}${josa(lk.get(l))} 쓰는 중인 줄이에요`); return; }
});

// ---------- 누가 보는 중 · 고치는 중 (5차 지시 §3 — Supabase Realtime Presence, 표에는 아무것도 안 씀) ----------
// 규칙(나·끊긴 사람·고치는 중 거르기, 색, 글)은 prcore898.js(Devis와 같은 파일). 여기는 연결·보내기·그리기만.
const PR = { ch: null, room: null, key: (crypto.randomUUID ? crypto.randomUUID() : String(Math.random()).slice(2)),
  sent: null, sentAt: 0, sendT: 0, typeT: 0, beatT: 0, drawT: 0, lastKey: 0, seen: new Map(), metas: [] };
const lsGet = k => { try { return localStorage.getItem(k); } catch(e){ return null; } };
const lsSet = (k,v) => { try { localStorage.setItem(k, v); } catch(e){} };
const prWho = () => { const w = lsGet("sjb_who"); return w==="세종" || w==="현재" ? w : null; };   // 기기마다 한 번 고름
function drawMe(){
  const w = prWho();
  $("mePick").innerHTML = `<span class="meta">나</span>` + ["세종","현재"].map(x => `<button data-me="${x}" class="${x===w?'on':''}">${x}</button>`).join("");
}
$("mePick").onclick = e => { const b = e.target.closest("[data-me]"); if(!b) return; lsSet("sjb_who", b.dataset.me); drawMe(); prSet(true); };
function prState(){
  const open = cur && !$("detail").classList.contains("hide") && !document.hidden;
  return { who: prWho(), dev: innerWidth<=700 ? "폰" : "웹", sid: open ? cur.id : null, typing: Date.now()-PR.lastKey < 3000, at: Date.now() };
}
const prSame = (a,b) => a && b && a.who===b.who && a.dev===b.dev && a.sid===b.sid && a.typing===b.typing;
// 값이 바뀔 때만 · 2초에 한 번까지(now = 숨겨질 때처럼 바로) · force = 안 바뀌어도(1분마다·치는 중 5초마다)
function prSend(force, now){
  if(!PR.ch || !PR.ready) return;
  const st = prState();
  if(!force && prSame(st, PR.sent)) return;
  const wait = PR.sentAt + 2000 - Date.now();
  if(wait > 0 && !now){ clearTimeout(PR.sendT); PR.sendT = setTimeout(() => prSend(force), wait); return; }
  clearTimeout(PR.sendT);
  PR.sent = st; PR.sentAt = Date.now();
  PR.ch.track(st).catch(() => {});
}
function prTyped(){                     // 글쇠: 처음 한 번 · 계속 치면 5초마다 · 멈추고 3초 뒤 typing:false
  const was = Date.now()-PR.lastKey < 3000;
  PR.lastKey = Date.now();
  if(!was || !PR.sent || !PR.sent.typing) prSend();
  else if(Date.now()-PR.sentAt >= 5000) prSend(true);
  clearTimeout(PR.typeT); PR.typeT = setTimeout(() => prSend(), 3050);
}
function prOff(){
  if(PR.ch) sb.removeChannel(PR.ch);
  clearInterval(PR.beatT); clearInterval(PR.drawT); clearTimeout(PR.sendT);
  Object.assign(PR, { ch: null, room: null, ready: false, wasUp: false, sent: null, metas: [] }); PR.seen.clear(); prDraw();
}
async function prOn(room){
  prOff();
  PR.room = room;                                              // 바로 적어 둠(겹쳐 두 번 안 붙게)
  const { data } = await sb.auth.getSession();
  if(!data.session || PR.room !== room) return;
  sb.realtime.setAuth(data.session.access_token);
  const ch = sb.channel("board:" + room, { config: { private: true, presence: { key: PR.key }, broadcast: { self: false, ack: false } } });   // 같이 고치기(#900)도 이 채널
  PR.ch = ch;
  ch.on("presence", { event: "sync" }, () => {
    const st = ch.presenceState(), now = Date.now(), live = new Set();
    PR.metas = Object.values(st).flat().map(m => {            // seen = 그 상태를 내가 받은 시각(시계가 달라도 끊긴 사람 가려냄)
      const id = m.phx_ref || JSON.stringify(m); live.add(id);
      if(!PR.seen.has(id)) PR.seen.set(id, now);
      return { ...m, seen: PR.seen.get(id) };
    });
    for(const id of [...PR.seen.keys()]) if(!live.has(id)) PR.seen.delete(id);
    prDraw();
  });
  ch.on("broadcast", { event: "live" }, ({ payload }) => lvRecv(payload));
  ch.subscribe(s => {                                          // 끊기면 supabase-js 가 다시 붙음 · 알림 안 띄움 · 거절되면 조용히 꺼 둠
    if(s === "SUBSCRIBED"){ const again = PR.wasUp; PR.ready = true; PR.wasUp = true; PR.sent = null; prSend(true, true); lvUp(again); }
    else { PR.ready = false; lvDrawLocks(); }
  });
  PR.beatT = setInterval(() => prSend(true), 60000);
  PR.drawT = setInterval(prDraw, 2000);                        // 3분·8초 지나 사라지는 것 반영
}
// 화면이 바뀔 때마다 부름: 연결(방·이름이 있을 때) · 내 상태 보내기
function prSet(){
  const room = (cur && cur.room_id) || (rows.find(r => r.room_id) || {}).room_id || null, who = prWho();
  drawMe();
  if(!room || !who || !$("login").classList.contains("hide")){ if(PR.ch || PR.room) prOff(); return; }
  if(PR.room !== room){ prOn(room); return; }
  prSend(false, document.hidden);                              // 숨겨지면 바로 sid:null
}
function prDraw(){
  const me = prWho(), now = Date.now();
  document.querySelectorAll("[data-pv]").forEach(el => {
    const vs = prViewers(PR.metas, me, el.dataset.pv, now);
    el.innerHTML = vs.slice(0,3).map(v => `<i style="background:${prColor(v.who)}" title="${esc(prTip(v))}">${esc([...v.who][0])}</i>`).join("")
      + (vs.length>3 ? `<i class="more" title="${esc(vs.slice(3).map(prTip).join(", "))}">+${vs.length-3}</i>` : "");
  });
  const vs = cur && !$("detail").classList.contains("hide") ? prViewers(PR.metas, me, cur.id, now) : [];
  $("pvBar").innerHTML = vs.map(v => { const t = esc(prBarTxt(v)); return `<span title="${esc(prTip(v))}"><b style="background:${prColor(v.who)}"></b>${v.typing ? t.replace(/…$/, "") + '<span class="dots"><i>.</i><i>.</i><i>.</i></span>' : t}</span>`; }).join("");
}
window.addEventListener("resize", () => prSend());

// ---------- 자동 저장 · 남이 고친 글 안 덮기 (5차 지시 §1·§2 — Devis와 같은 규칙) ----------
const FIELDS = ["title","plan","product","author","body","must_shots","memo"];
const MERGE = ["body","must_shots","memo"];   // 줄 단위로 합치는 칸(6차 §7)
const norm = v => String(v ?? "").replace(/\r\n?/g,"\n").trim();   // \r\n = \n · 앞뒤 공백 · 없음 = 빈 글
const same = (a,b) => norm(a)===norm(b);
const rv = (row,k) => k==="author" ? (row[k]||"현재") : (row[k] ?? "");   // 쓴 사람 칸은 비면 '현재'로 보임(고르기 칸)
const formVal = k => $("f_"+k).value;
let base = null;            // 열 때·저장 뒤 그 줄 값(기준) + updated_at
let conflict = null;        // {srv, keys} — 겹친 칸이 있어 저장을 멈춤
let autoT = 0, queue = Promise.resolve(), waiting = 0;
function takeBase(row){ base = {updated_at: row.updated_at}; FIELDS.forEach(k => base[k] = rv(row,k)); }
const changedKeys = () => base ? FIELDS.filter(k => !same(formVal(k), base[k])) : [];
function refreshDirty(){ dirty = changedKeys().length>0; $("saveBtn").disabled = !dirty; }
function status(t){ $("savedMsg").textContent = t; }
const now = () => new Date().toLocaleTimeString('ko-KR');
function onEdit(typed){                 // 칸을 고칠 때마다: 치기를 멈추고 1.5초 뒤 저장 (typed = 사람이 친 것 → '고치는 중')
  refreshDirty(); if(typed) prTyped();
  clearTimeout(autoT);
  if(dirty && !conflict) autoT = setTimeout(() => saveNow(false), 1500);
}
function saveNow(manual){              // 한 번에 하나씩 차례로 — 줄 선 저장이 이미 있으면 그게 최신 글로 저장
  clearTimeout(autoT);
  if(waiting>0) return queue;
  waiting++;
  queue = queue.then(() => { waiting--; return guardedSave(manual); }).catch(e => { console.error(e); return false; });
  return queue;
}
// 남이 바꾼 칸 중 내가 안 고친 칸은 조용히 새 값으로(커서·스크롤 그대로)
function adoptOthers(srv, skip){
  let redraw = false;
  for(const k of FIELDS){
    if(skip.includes(k) || same(rv(srv,k), base[k]) || !same(formVal(k), base[k])) continue;
    $("f_"+k).value = rv(srv,k); base[k] = rv(srv,k);
    if(k==="body" || k==="must_shots") redraw = true;
  }
  if(redraw) lvBody();
  if(redraw) setView(view); else { $("d_title").textContent = formVal("title") || "(제목 없음)"; $("d_meta").textContent = [formVal("plan"), formVal("product")].filter(Boolean).join(" · "); }
}
function takeRow(row){ Object.assign(cur, row); rows = rows.map(r => r.id===cur.id ? cur : r); renderSteps(); }
async function guardedSave(manual){
  if(!cur || !base || conflict) return !conflict;
  const id = cur.id;
  for(let n=0; n<3; n++){
    const mine = {}; FIELDS.forEach(k => mine[k] = formVal(k));
    const keys = FIELDS.filter(k => !same(mine[k], base[k]));      // 내가 바꾼 칸만
    if(!keys.length){ refreshDirty(); return true; }
    status("저장 중…");
    const {data: srv, error: e1} = await sb.from("scripts").select("*").eq("id", id).single();
    if(e1) return saveFail(e1, manual);
    if(!cur || cur.id!==id) return false;
    // 그사이 바뀌었으면: 본문·꼭 찍을 장면·메모는 줄 단위 합치기(Devis 와 같은 merge3) · 다른 칸은 같은 칸을 남이 고쳤으면 겹침
    const want = {}, clash = [];
    for(const k of keys){
      if(srv.updated_at === base.updated_at || same(rv(srv,k), base[k])){ want[k] = mine[k]; continue; }
      if(MERGE.includes(k)){ const m = DevisSB.live.merge3(base[k], rv(srv,k), mine[k]); if(m.ok) want[k] = m.text; else clash.push(k); }
      else if(same(rv(srv,k), mine[k])) want[k] = mine[k]; else clash.push(k);
    }
    if(clash.length){ showConflict(srv, clash); return false; }  // 같은 줄(칸)을 서로 다르게 고침 → 저장 안 함
    const patch = {};
    keys.forEach(k => { if(!same(rv(srv,k), want[k])) patch[k] = want[k]; });
    let row = srv;
    if(Object.keys(patch).length){
      const {data, error} = await sb.from("scripts").update(patch).eq("id", id).eq("updated_at", srv.updated_at).select();
      if(error) return saveFail(error, manual);
      if(!data || !data.length) continue;                          // 그사이 또 바뀜 → 다시 읽고 비교(세 번까지)
      row = data[0];
    }
    if(!cur || cur.id!==id) return false;
    for(const k of keys) if(want[k] !== mine[k]){                   // 합친 글(남이 다른 줄에 넣은 것)을 화면에도 — 그사이 친 것은 그대로
      const t = DevisSB.live.merge3(mine[k], want[k], formVal(k), { mineWins: true }).text;
      if(k === "body") lvApply(formVal("body"), t, true); else $("f_"+k).value = t;
    }
    keys.forEach(k => base[k] = rv(row,k));                         // 보낸 칸의 기준만 올림
    base.updated_at = row.updated_at;
    adoptOthers(row, keys);
    takeRow(row);
    refreshDirty(); status("저장됨 " + now());
    if(dirty && !conflict) onEdit();                                 // 저장하는 사이 또 고친 것
    return true;
  }
  status("저장 못 함 — 잠시 뒤 다시 저장할게요");
  clearTimeout(autoT); autoT = setTimeout(() => saveNow(false), 5000);
  return false;
}
function saveFail(err, manual){
  console.error(err);
  status("저장 못 함 — 인터넷을 확인해 주세요");
  if(manual) alert("저장 실패: " + err.message);
  clearTimeout(autoT); if(dirty && !conflict) autoT = setTimeout(() => saveNow(false), 5000);
  return false;
}
function showConflict(srv, keys){
  conflict = {srv, keys}; clearTimeout(autoT);
  $("cMsg").textContent = keys.some(k => MERGE.includes(k)) ? "다른 곳에서 이 대본의 같은 줄을 고쳤어요 — 내 글은 그대로 있어요(저장은 멈춤)" : "다른 곳에서 이 대본을 고쳤어요 — 내 글은 그대로 있어요(저장은 멈춤)";
  $("conflict").classList.remove("hide");
  status("저장 멈춤");
}
function hideConflict(){ conflict = null; $("conflict").classList.add("hide"); }
$("cTake").onclick = () => {           // 겹친 칸을 남이 고친 글로 · 내 본문은 되돌리기 기록에
  if(!conflict) return;
  const {srv, keys} = conflict, myBody = formVal("body");
  keys.forEach(k => { $("f_"+k).value = rv(srv,k); base[k] = rv(srv,k); });
  base.updated_at = srv.updated_at;
  hideConflict();
  adoptOthers(srv, keys);
  if(keys.includes("body")) pendingUndo = myBody;
  setView(view); lvBody();
  refreshDirty(); status("새 글로 바꿈");
  if(dirty) onEdit();
};
$("cMine").onclick = () => {           // 겹친 칸의 기준을 지금 값으로 올리고 다시 저장
  if(!conflict) return;
  const {srv, keys} = conflict;
  keys.forEach(k => base[k] = rv(srv,k));
  base.updated_at = srv.updated_at;
  hideConflict(); refreshDirty();
  saveNow(true);
};
// 다시 열 때·창이 다시 보일 때: 그 줄이 바뀌었으면 — 안 저장한 고침이 없으면 조용히 새 글, 있으면 저장(겹치면 막대)
async function refreshCur(){
  if(!cur || !base) return;
  const id = cur.id;
  const {data: srv, error} = await sb.from("scripts").select("*").eq("id", id).single();
  if(error || !srv || !cur || cur.id!==id) return;
  if(srv.updated_at === base.updated_at) return;
  if(!dirty && !conflict){ adoptOthers(srv, []); base.updated_at = srv.updated_at; takeRow(srv); return; }
  takeRow({stage: srv.stage, stage_log: srv.stage_log, thumb: srv.thumb});
  if(!conflict) saveNow(false);
}
window.addEventListener("beforeunload", e => { if(conflict || dirty){ e.preventDefault(); e.returnValue = ""; } });
function setView(v){
  view = v;
  document.querySelectorAll("#vtabs button").forEach(b => b.classList.toggle("on", b.dataset.v===v));
  $("v_dsb").classList.toggle("hide", v==="txt");
  $("v_txt").classList.toggle("hide", v!=="txt");
  document.querySelector(".wrap").classList.toggle("wide", v==="sb" && !$("detail").classList.contains("hide"));
  // 스토리보드·대본만 = Devis 파일(devis-storyboard.js)로 그림. '글' = 원래 고치기 칸
  // 스토리보드는 칸 안에서 바로 고침(edit). 고친 글은 '대본 원문' 칸으로 → 저장 단추로 저장. 같은 글이면 다시 안 그림(커서 그대로)
  if(v==="sb") DevisSB.render($("v_dsb"), $("f_body").value, { view: "sb", mustShots: $("f_must_shots").value.split("\n"), edit: true,
    onChange(t){ $("f_body").value = t; onEdit(true); lvBody(); },
    onCursor(){ lvTrack(); },                                  // 내 커서 줄이 바뀜 → 'lk'
    onLockedOut(l){ lvToast(`${l.who}${josa(l.who)} 쓰는 중인 줄이에요`); } });
  if(v==="sb") lvDrawLocks();
  if(v==="sb" && pendingUndo!=null){ const I = $("v_dsb")._dsbEdit; if(I && I.hist) I.hist.push(pendingUndo); pendingUndo = null; }  // [새 글 보기] 전 내 글 = 되돌리기(↶)로 돌아옴
  else if(v==="tts") DevisSB.render($("v_dsb"), $("f_body").value, { view: "tts", mustShots: $("f_must_shots").value.split("\n") });
  $("d_title").textContent = $("f_title").value || "(제목 없음)";
  $("d_meta").textContent = [$("f_plan").value, $("f_product").value].filter(Boolean).join(" · ");
}
$("vtabs").onclick = e => { const b = e.target.closest("[data-v]"); if(b) setView(b.dataset.v); };

async function load(){
  const {data, error} = await sb.from("scripts").select("*").order("updated_at",{ascending:false});
  if(error){ alert("불러오기 실패: "+error.message); return; }
  rows = data; renderList();
}

function renderList(){
  const todo = w => rows.filter(r => r.stage<5 && ownerOf(r)===w)
    .map(r => `<a data-id="${r.id}">${esc(r.title||"(제목 없음)")} · ${STAGES[r.stage].pct}%</a>`).join("") || `<div class="meta">없음</div>`;
  $("todoSJ").innerHTML = todo("세종");
  $("todoHJ").innerHTML = todo("현재");

  const F = ["진행 중","작성 중","완료","전체"];
  $("filters").innerHTML = F.map(f => `<button class="${f===filter?'on':''}" data-f="${f}">${f}</button>`).join("");
  const list = rows.filter(r => filter==="전체" || (filter==="완료" ? r.stage===5 : filter==="작성 중" ? r.stage===0 : r.stage>0 && r.stage<5));
  $("cards").innerHTML = list.map(r => {

    const th = typeof r.thumb==="string" && r.thumb.startsWith("data:image/") ? `<img class="thumb" alt="" src="${r.thumb.replace(/"/g,"")}">` : "";  // 편집기(Devis)가 넣는 카드 썸네일(긴 변 240px)
    return `<div class="card ${done?'done':whoCls(w)}" data-id="${r.id}"><div class="cardIn">${th}<div>
      <div class="row" style="justify-content:space-between">
        <span class="t">${esc(r.title||"(제목 없음)")}</span>
        <span class="pvs" data-pv="${r.id}"></span>${done?'<span class="who none">완료</span>':`<span class="who ${whoCls(w)}">${w||"-"}</span>`}
      </div>
      <div class="meta one">${esc(r.plan)} ${r.product?"· "+esc(r.product):""}</div>
      <div class="meta">${done?"업로드 완료":"다음: "+esc(st.next)} · ${st.pct}%</div>
      <div class="bar"><i style="width:${st.pct}%;background:${done?'#bbb':w==='세종'?'var(--sj)':'var(--hj)'}"></i></div>
    </div></div></div>`;
  }).join("") || `<div class="meta">대본이 없다.</div>`;
  prDraw(); prSet();
}

function open(id){
  cur = rows.find(r => r.id===id); if(!cur) return;
  ["title","plan","product","body","must_shots","memo"].forEach(k => $("f_"+k).value = cur[k]||"");
  $("f_author").value = cur.author||"현재";
  takeBase(cur); hideConflict(); clearTimeout(autoT); pendingUndo = null;
  $("savedMsg").textContent = ""; refreshDirty();
  renderSteps(); show("detail"); setView("sb"); window.scrollTo(0,0);
  lvOpen(); refreshCur(); prSet();
}

function renderSteps(){
  const s = cur.stage, w = ownerOf(cur);
  $("progressNow").innerHTML = s===5 ? `<b>100% 완료</b>`
    : `<b>${STAGES[s].pct}%</b> · 다음: ${esc(STAGES[s].next)} <span class="who ${whoCls(w)}">${w}</span>`;
  $("steps").innerHTML = STAGES.slice(1).map((st,i) => {
    const n = i+1, t = cur.stage_log?.[n];
    const who = n===1 ? cur.author : STAGES[n-1].who;  // INTEGRATION.md 표의 '다음 담당'
    return `<li class="${n<=s?'ok':''} ${n===s+1?'cur':''}">${n<=s?'✓':'○'} <span class="lbl">${esc(st.label)}</span> ${t?`<span class="meta">${new Date(t).toLocaleString('ko-KR')}</span>`:""}<span class="sw">${esc(who||"")}</span></li>`;
  }).join("");
  $("nextBtn").disabled = s>=5; $("prevBtn").disabled = s<=0;
}

async function save(patch){
  const {data, error} = await sb.from("scripts").update(patch).eq("id",cur.id).select().single();
  if(error){ alert("저장 실패: "+error.message); return false; }
  Object.assign(cur, data); rows = rows.map(r => r.id===cur.id?cur:r);   // 단계 올리기 같은 일부러 하는 저장 — 겹침 검사 안 함
  $("savedMsg").textContent = "저장됨 "+now();
  return true;
}

$("saveBtn").onclick = () => saveNow(true);   // 누르면 바로 저장(같은 겹침 검사)
$("v_txt").addEventListener("input", () => { onEdit(true); lvBody(); });
$("v_txt").addEventListener("change", () => onEdit(false));
$("nextBtn").onclick = async () => {
  const n = cur.stage+1; if(n>5) return;
  if(!confirm(`"${STAGES[n].label}" 체크할까?`)) return;
  const log = {...(cur.stage_log||{}), [n]: new Date().toISOString()};
  if(await save({stage:n, stage_log:log})) renderSteps();
};
$("prevBtn").onclick = async () => {
  if(cur.stage<=0 || !confirm("한 단계 되돌릴까?")) return;
  const log = {...(cur.stage_log||{})}; delete log[cur.stage];
  if(await save({stage:cur.stage-1, stage_log:log})) renderSteps();
};
$("delBtn").onclick = async () => {
  if(!confirm("이 대본을 삭제할까? 되돌릴 수 없다.")) return;
  const {error} = await sb.from("scripts").delete().eq("id",cur.id);
  if(error) return alert("삭제 실패: "+error.message);
  show("list"); load();
};
$("newBtn").onclick = async () => {
  const {data, error} = await sb.from("scripts").insert({title:"새 대본"}).select().single();
  if(error) return alert("생성 실패: "+error.message);
  rows.unshift(data); open(data.id);
};
$("backBtn").onclick = async () => {          // 대본을 닫을 때 바로 저장
  if(!conflict && dirty) await saveNow(false);
  if(conflict && !confirm("다른 곳에서 고친 글과 겹쳐서 내 글이 저장 안 됐어요. 그래도 목록으로 갈까요?")) return;
  if(!conflict && dirty && !confirm("저장 못 한 글이 있어요. 그래도 목록으로 갈까요?")) return;
  lvClose(); hideConflict(); clearTimeout(autoT); base = null; dirty = false; cur = null;
  show("list"); load(); prSet();
};
document.addEventListener("click", e => {
  const f = e.target.closest("#filters [data-f]"); if(f){ filter = f.dataset.f; renderList(); return; }
  const c = e.target.closest("[data-id]"); if(c && !$("list").classList.contains("hide")) open(c.dataset.id);
});
$("loginBtn").onclick = async () => {
  $("loginMsg").textContent = "";
  const {error} = await sb.auth.signInWithPassword({email:$("email").value.trim(), password:$("pw").value});
  if(error) $("loginMsg").textContent = "로그인 실패: "+error.message; else start();
};
$("logoutBtn").onclick = async () => { prOff(); await sb.auth.signOut(); show("login"); };
document.addEventListener("visibilitychange", () => {
  const inDetail = !$("detail").classList.contains("hide");
  if(document.hidden){ if(inDetail && dirty && !conflict) saveNow(false); }   // 창을 숨길 때 바로 저장
  else if(inDetail) refreshCur();
  else if(!$("list").classList.contains("hide")) load();
  prSet();
});

async function start(){ show("list"); await load(); }
sb.auth.getSession().then(({data}) => data.session ? start() : show("login"));
</script>
</body>
</html>
